name: Generate snake animation
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#B026FF&color_dots=#EDE7F6,#D8B4FE,#A64DFF,#FF2BD6,#C0179E
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#1A0B3D,#5A2AA6,#A64DFF,#FF2BD6,#00F0FF
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
